plugins {
    id 'com.android.application'
}

def stableDebugKeystore = rootProject.file('ci/math-debug.keystore')
def debugKeySecret = 'math' + 'debug'

android {
    namespace 'com.balzikz.mathclient'
    compileSdk 36
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.balzikz.mathclient'
        minSdk 23
        targetSdk 36
        versionCode 30
        versionName '0.18.0-alpha'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
            }
        }
    }

    signingConfigs {
        mathDebug {
            if (stableDebugKeystore.exists()) {
                storeFile stableDebugKeystore
                storePassword debugKeySecret
                keyAlias debugKeySecret
                keyPassword debugKeySecret
            }
        }
    }

    buildTypes {
        debug {
            if (stableDebugKeystore.exists()) {
                signingConfig signingConfigs.mathDebug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.games:games-activity:4.4.1'
}
