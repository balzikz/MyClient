plugins {
    id 'com.android.application'
}

def parityJniRoot = layout.buildDirectory.dir('generated/parity-jni').get().asFile
def parityShinSource = file('src/parity/native/libshin.so.b64')
def parityShinOutput = new File(parityJniRoot, 'arm64-v8a/libshin.so')

android {
    namespace 'com.balzikz.mathclient.parity'
    compileSdk 36
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.balzikz.mathclient.parity'
        minSdk 28
        targetSdk 36
        versionCode 33
        versionName '0.20.0-parity'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20 -Wall -Wextra -Werror'
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile 'src/parity/AndroidManifest.xml'
            java.srcDirs = [
                    'src/parity/java',
                    '../app/src/main/java/com/mojang/minecraftpe',
                    '../app/src/main/java/com/microsoft'
            ]
            res.srcDirs = ['src/parity/res']
            jniLibs.srcDirs = [parityJniRoot]
        }
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/parity/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('decodeParityShin') {
    inputs.file(parityShinSource)
    outputs.file(parityShinOutput)
    doLast {
        if (!parityShinSource.isFile()) {
            throw new GradleException('Missing Flarial-authorized libshin.so base64 payload')
        }
        parityShinOutput.parentFile.mkdirs()
        String encoded = parityShinSource.getText('UTF-8').replaceAll('\\s', '')
        parityShinOutput.bytes = encoded.decodeBase64()
        if (parityShinOutput.length() < 100_000L) {
            throw new GradleException('Decoded libshin.so is unexpectedly small')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('decodeParityShin')
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.games:games-activity:4.4.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}
