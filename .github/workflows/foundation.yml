name: MATH Foundation
on:
  push:
    branches: ['rebuild/**']
    paths: ['rebuild/**', '.github/workflows/foundation.yml']
  pull_request:
    paths: ['rebuild/**', '.github/workflows/foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android tooling
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Restore existing test signing key
        run: base64 --decode ci/math-debug.keystore.b64 > ci/math-debug.keystore
      - name: Regression tests, lint and APK
        run: gradle -p rebuild :core:regressionTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Verify artifact
        run: |
          unzip -l rebuild/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libmathprobe.so'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify rebuild/app/build/outputs/apk/debug/app-debug.apk
          cp rebuild/app/build/outputs/apk/debug/app-debug.apk MATH-Foundation-0.1.0-debug.apk
          sha256sum MATH-Foundation-0.1.0-debug.apk > MATH-Foundation-0.1.0-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: math-foundation-debug
          path: |
            MATH-Foundation-0.1.0-debug.apk
            MATH-Foundation-0.1.0-debug.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-lint
          path: rebuild/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: math-foundation-debug
          path: apk
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Own JNI and EGL smoke test (not Minecraft)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash rebuild/tools/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-smoke
          path: smoke-results/
          if-no-files-found: ignore
