name: Stage 3.9 Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Compile Stage 3.9
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace >stage39.log 2>&1
          code=$?
          echo "$code" > stage39.exit
          tail -n 240 stage39.log > stage39-tail.txt
          exit 0
      - name: Upload build tail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage39-build-tail
          path: |
            stage39-tail.txt
            stage39.exit
          if-no-files-found: error
      - name: Enforce compile result
        run: test "$(cat stage39.exit)" = "0"
