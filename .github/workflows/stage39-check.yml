name: Stage 3.9 Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Compile Stage 3.9
        run: |
          if ! gradle :app:assembleDebug --stacktrace >stage39.log 2>&1; then
            tail -n 180 stage39.log
            exit 1
          fi
          tail -n 40 stage39.log
