name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore stable debug key
        run: base64 --decode ci/math-debug.keystore.b64 > ci/math-debug.keystore

      - name: Build debug APK with native core
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify native libraries and signature
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libmathclient.so"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libmathlinker.so"
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "lib/arm64-v8a/libmathshim.so"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: math-client-stage-4-shim-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
