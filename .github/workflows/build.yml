name: Build Android APK

on:
  push:
    branches: [ main, stage-4.0-math-shim, stage-4.1-bedrock-bind, stage-4.2-bedrock-jni, stage-4.3-gameactivity-forward ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore stable debug key
        run: base64 --decode ci/math-debug.keystore.b64 > ci/math-debug.keystore

      - name: Build debug APK with native core
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > stage4-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "===== STAGE 4.3 BUILD FAILURE TAIL ====="
            tail -n 250 stage4-build.log
            exit "$status"
          fi
          echo "Stage 4.3 Gradle build completed successfully."

      - name: Upload Stage 4 build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-build-log
          path: stage4-build.log
          if-no-files-found: error

      - name: Verify native forwarding exports and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep "lib/arm64-v8a/libmathclient.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libmathlinker.so"
          unzip -l "$APK" | grep "lib/arm64-v8a/libmathshim.so"
          rm -rf stage4-apk-check
          mkdir stage4-apk-check
          unzip -q "$APK" "lib/arm64-v8a/libmathshim.so" -d stage4-apk-check
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" -Ws stage4-apk-check/lib/arm64-v8a/libmathshim.so | grep "Java_com_google_androidgamesdk_GameActivity_initializeNativeCode"
          "$READELF" -Ws stage4-apk-check/lib/arm64-v8a/libmathshim.so | grep " GameActivity_onCreate"
          "$READELF" -Ws stage4-apk-check/lib/arm64-v8a/libmathshim.so | grep "MathShimBridge_nativeIsBedrockForwarded"
          "$READELF" -Ws stage4-apk-check/lib/arm64-v8a/libmathshim.so | grep "MathShimBridge_nativeInitializeMinecraftJni"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: math-client-stage-4.3-gameactivity-forward-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
