plugins { id 'com.android.application' }

android {
    namespace 'com.balzikz.mathclient.foundation'
    compileSdk 36
    ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'com.balzikz.mathclient.foundation'
        minSdk 28
        targetSdk 36
        versionCode 3
        versionName '0.3.0-host-preparation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall -Wextra -Werror'
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }
    buildFeatures { buildConfig true }
    // Existing test key is optional locally; CI restores it for installable updates.
    signingConfigs {
        stableDebug {
            def keyFile = rootProject.file('../ci/math-debug.keystore')
            if (keyFile.exists()) {
                storeFile keyFile
                storePassword 'mathdebug'
                keyAlias 'mathdebug'
                keyPassword 'mathdebug'
            }
        }
    }
    buildTypes {
        debug {
            if (rootProject.file('../ci/math-debug.keystore').exists()) {
                signingConfig signingConfigs.stableDebug
            }
        }
        release { minifyEnabled false }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
dependencies {
    implementation project(':core')
    implementation project(':contract')
    implementation 'androidx.core:core:1.16.0'
}
